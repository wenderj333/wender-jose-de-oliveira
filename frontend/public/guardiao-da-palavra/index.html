<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardião da Palavra: O Desafio dos Pergaminhos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
        }
      }
    </script>
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <style>
      :root {
        --parchment-text: #3c2a1a;
        --gold: #d4af37;
        --dark-wood: #1a0f0a;
      }
      html, body, #game-container { 
        width: 100%; 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background: #050505; 
        overflow: hidden; 
        font-family: 'Cormorant Garamond', serif;
      }
      #game-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        isolation: isolate;
        perspective: 1400px;
        background: url('assets/scribe_desk_bg_no_candle.webp') no-repeat center center;
        background-size: cover;
      }
      #scene3d {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #scene3d.is-ready { opacity: 1; }
      #scene3d canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ui-layer {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .ui-layer * {
        pointer-events: auto;
      }
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      :focus-visible {
        outline: 3px solid rgba(212, 175, 55, 0.95);
        outline-offset: 3px;
      }
      [tabindex="-1"]:focus {
        outline: 2px solid rgba(180, 138, 50, 0.72);
        outline-offset: 3px;
      }
      
      /* HUD styles */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 3;
        color: var(--gold);
        font-family: 'Cinzel', serif;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        font-size: 1.5rem;
      }
      .topbar-tools {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 3;
        z-index: 120;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .presence-indicator {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 31px;
        box-sizing: border-box;
        padding: 5px 10px;
        border: 1px solid rgba(212, 175, 55, 0.82);
        border-radius: 18px;
        background: rgba(13, 8, 4, 0.76);
        color: #fff3cf;
        font-family: 'Cinzel', serif;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }
      .presence-indicator strong {
        color: var(--gold);
        font-size: 0.9rem;
      }
      .presence-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8fae68;
        box-shadow: 0 0 0 3px rgba(143, 174, 104, 0.18);
      }
      .profile-sync-indicator {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 31px;
        box-sizing: border-box;
        padding: 5px 9px;
        border: 1px solid rgba(212, 175, 55, 0.58);
        border-radius: 18px;
        background: rgba(13, 8, 4, 0.72);
        color: #e8d39b;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
        line-height: 1;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }
      .profile-sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #aa8f5a;
        box-shadow: 0 0 0 3px rgba(170, 143, 90, 0.15);
      }
      .profile-sync-indicator.is-connected {
        border-color: rgba(143, 174, 104, 0.85);
        color: #e6efc7;
      }
      .profile-sync-indicator.is-connected .profile-sync-dot {
        background: #8fae68;
        box-shadow: 0 0 0 3px rgba(143, 174, 104, 0.18);
      }
      .profile-sync-indicator.is-pending .profile-sync-dot {
        background: #d4af37;
        animation: profileSyncPulse 1.2s ease-in-out infinite;
      }
      .profile-sync-indicator.is-error {
        border-color: rgba(180, 109, 75, 0.86);
        color: #f2c9ad;
      }
      .profile-sync-indicator.is-error .profile-sync-dot {
        background: #b46d4b;
        box-shadow: 0 0 0 3px rgba(180, 109, 75, 0.18);
      }
      .profile-sync-action {
        min-height: 31px;
        padding: 5px 9px;
        border: 1px solid rgba(212, 175, 55, 0.82);
        border-radius: 18px;
        background: rgba(13, 8, 4, 0.76);
        color: var(--gold);
        cursor: pointer;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .profile-sync-action:hover:not(:disabled) {
        background: rgba(73, 43, 16, 0.92);
      }
      .profile-sync-action:disabled {
        cursor: wait;
        opacity: 0.72;
      }
      .language-control {
        display: inline-flex;
        align-items: center;
      }
      .language-control select {
        min-height: 31px;
        padding: 5px 8px;
        border: 1px solid rgba(212, 175, 55, 0.82);
        border-radius: 18px;
        background: rgba(13, 8, 4, 0.76);
        color: var(--gold);
        cursor: pointer;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
      }
      .language-control select:focus-visible {
        outline: 2px solid rgba(255, 243, 207, 0.9);
        outline-offset: 2px;
      }
      @keyframes profileSyncPulse {
        0%, 100% { opacity: 0.56; transform: scale(0.86); }
        50% { opacity: 1; transform: scale(1.12); }
      }

      .profile-continuity {
        box-sizing: border-box;
        width: min(100%, 700px);
        margin: 8px auto 10px;
        padding: 11px 12px 12px;
        border: 2px solid rgba(71, 115, 74, 0.62);
        border-left: 5px solid #47734a;
        border-radius: 9px;
        background: linear-gradient(145deg, rgba(232, 236, 190, 0.9), rgba(255, 247, 218, 0.94));
        color: #3f2817;
        text-align: left;
        box-shadow: 0 3px 9px rgba(68, 38, 12, 0.14);
      }
      .profile-continuity-heading {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .profile-continuity-emblem {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 31px;
        height: 31px;
        border: 2px solid #47734a;
        border-radius: 50%;
        background: #718b52;
        color: #fff9dc;
        font-family: 'Cinzel', serif;
        font-size: 1rem;
      }
      .profile-continuity-heading p {
        margin: 0 0 3px;
        color: #5e713f;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .profile-continuity-heading h2 {
        margin: 0;
        color: #28160a;
        font-family: 'Cinzel', serif;
        font-size: clamp(1rem, 2.3vw, 1.3rem);
        line-height: 1.08;
      }
      .profile-continuity-copy {
        margin: 8px 0 0;
        color: #4a2e16;
        font-size: 0.93rem;
        font-weight: 700;
        line-height: 1.18;
      }
      .profile-continuity-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }
      .profile-continuity-stats span {
        display: grid;
        gap: 2px;
        min-width: 0;
        padding: 7px 8px;
        border-left: 3px solid #718b52;
        border-radius: 5px;
        background: rgba(255, 247, 218, 0.72);
      }
      .profile-continuity-stats strong {
        color: #28160a;
        font-family: 'Cinzel', serif;
        font-size: 0.82rem;
        line-height: 1.08;
      }
      .profile-continuity-stats small {
        color: #63451f;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .profile-continuity-action {
        width: auto;
        margin: 9px 0 0;
        padding: 8px 13px;
        background: linear-gradient(135deg, #47734a, #718b52);
        border-color: #315b35;
        color: #fff8dc;
        font-size: 0.95rem;
      }

      /* Parchment Card */
      .parchment-container {
        position: relative;
        width: min(92vw, 1100px);
        max-width: none;
        height: 92%;
        max-height: 900px;
        background: url('assets/ancient_parchment_ui.webp') no-repeat center center;
        /* A arte possui transparência nas laterais; este enquadramento faz o papel ocupar a moldura inteira. */
        background-size: 136% 100%;
        display: flex;
        flex-direction: column;
        padding: clamp(58px, 9vh, 98px) clamp(58px, 9vw, 132px) clamp(50px, 8vh, 86px);
        box-sizing: border-box;
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 0.5s, transform 0.5s;
        pointer-events: none;
      }
      .parchment-container.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      .parchment-content {
        color: #24150c;
        text-align: center;
        overflow-y: auto;
        flex: 1;
        font-weight: 600;
        text-shadow: 0 1px 0 rgba(255, 245, 210, 0.55);
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        -webkit-overflow-scrolling: touch;
      }
      .parchment-content h1,
      .parchment-content h2,
      .parchment-content h3,
      .parchment-content h4,
      .parchment-content p,
      .parchment-content button,
      .parchment-content li,
      .parchment-content small,
      #feedback-overlay {
        overflow-wrap: break-word;
        word-break: normal;
        text-wrap: pretty;
      }
      .choice-button {
        box-sizing: border-box;
        white-space: normal;
        overflow-wrap: break-word;
        line-height: 1.2;
        touch-action: manipulation;
      }
      .parchment-content h2 {
        color: #1b1009;
        font-size: clamp(1.35rem, 2.5vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 0 rgba(255, 245, 210, 0.8);
      }
      .parchment-content > p {
        color: #1d1008;
        background: rgba(255, 247, 218, 0.72);
        border: 1px solid rgba(61, 36, 15, 0.35);
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 700;
        line-height: 1.35;
        text-shadow: none;
      }
      h1, h2 {
        font-family: 'Cinzel', serif;
        margin-top: 0;
      }
      .choice-button {
        display: block;
        width: 80%;
        margin: 10px auto;
        padding: 15px;
        background: rgba(45, 25, 11, 0.88);
        border: 2px solid #6c431f;
        border-radius: 6px;
        color: #fff3cf;
        font-size: 1.2rem;
        cursor: pointer;
        font-family: 'Cormorant Garamond', serif;
        font-weight: 700;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        transition: background 0.2s, transform 0.2s;
      }
      .choice-button:hover {
        background: rgba(80, 43, 16, 0.95);
        transform: translateY(-1px);
      }
      .choice-button.correct {
        background: rgba(0, 128, 0, 0.2);
        border-color: green;
      }
      .choice-button.wrong {
        background: rgba(255, 0, 0, 0.2);
        border-color: red;
      }
      .choice-button:disabled {
        cursor: default;
      }
      .choice-button.answer-inscribed {
        animation: answerInscribed 0.48s ease-out both;
      }
      .choice-button.teaching-recorded {
        animation: teachingRecorded 0.56s ease-out both;
      }
      @keyframes answerInscribed {
        0% { transform: translateY(0); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
        45% { transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.18), 0 4px 10px rgba(36, 20, 8, 0.18); }
        100% { transform: translateY(0); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
      }
      @keyframes teachingRecorded {
        0% { transform: translateY(0); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
        42% { transform: translateY(-1px); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18); }
        100% { transform: translateY(0); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
      }

      /* Start Screen */
      #start-screen {
        background: rgba(0,0,0,0.7);
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: clamp(14px, 4vh, 40px) 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        color: white;
        z-index: 100;
      }
      .btn-start {
        background: var(--gold);
        color: black;
        border: none;
        padding: 20px 40px;
        font-size: 2rem;
        font-family: 'Cinzel', serif;
        cursor: pointer;
        margin-top: 20px;
        transition: transform 0.2s;
      }
      .btn-start:hover {
        transform: scale(1.05);
      }

      .start-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 720px;
        width: min(100%, 720px);
        box-sizing: border-box;
        margin: 0 auto;
        padding: clamp(24px, 5vh, 52px) 24px 42px;
        text-align: center;
      }
      .start-content h1 {
        margin: 0;
        color: #fff7d6;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        line-height: 1.05;
        text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.8);
      }
      .start-content .start-subtitle {
        margin: 10px 0 12px;
        color: #ead9ae;
        font-size: clamp(1.2rem, 3vw, 1.55rem);
      }
      .start-welcome {
        max-width: 570px;
        margin: 4px 0 13px;
        color: #fff3cf;
        font-size: 1.18rem;
        line-height: 1.3;
      }
      .session-rhythm-entry {
        box-sizing: border-box;
        width: min(100%, 680px);
        margin: 8px auto 3px;
        padding: 12px 13px 13px;
        border: 2px solid rgba(212, 175, 55, 0.8);
        border-radius: 10px;
        background: linear-gradient(145deg, rgba(22, 12, 6, 0.86), rgba(65, 38, 16, 0.84));
        box-shadow: inset 0 0 0 1px rgba(255, 239, 178, 0.16), 0 4px 12px rgba(0, 0, 0, 0.26);
        color: #fff3cf;
        text-align: left;
      }
      .session-rhythm-heading {
        text-align: center;
      }
      .session-rhythm-heading p {
        margin: 0 0 3px;
        color: #e1bd62;
        font-family: 'Cinzel', serif;
        font-size: 0.67rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .session-rhythm-heading h2 {
        margin: 0;
        color: #fff7d6;
        font-family: 'Cinzel', serif;
        font-size: clamp(1.08rem, 2.5vw, 1.45rem);
        line-height: 1.08;
      }
      .session-rhythm-heading span {
        display: block;
        max-width: 580px;
        margin: 5px auto 0;
        color: #f1dfb0;
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.18;
      }
      .session-rhythm-choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
        margin-top: 10px;
      }
      .session-rhythm-choice {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        box-sizing: border-box;
        min-width: 0;
        min-height: 153px;
        padding: 9px 8px;
        border: 1px solid rgba(212, 175, 55, 0.58);
        border-radius: 7px;
        background: rgba(45, 25, 11, 0.78);
        color: #fff3cf;
        cursor: pointer;
        font-family: 'Cormorant Garamond', serif;
        text-align: left;
        transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      }
      .session-rhythm-choice:hover,
      .session-rhythm-choice:focus-visible,
      .session-rhythm-choice.is-selected {
        border-color: #f0d58e;
        background: rgba(84, 48, 17, 0.94);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.16), 0 3px 9px rgba(0, 0, 0, 0.2);
        transform: translateY(-1px);
      }
      .session-rhythm-choice.is-selected .session-rhythm-mark {
        background: linear-gradient(145deg, #f0d58e, #a77a27);
      }
      .session-rhythm-status {
        margin: 8px 0 0;
        padding: 6px 8px;
        border-left: 3px solid #d4af37;
        background: rgba(45, 25, 11, 0.5);
        color: #f1dfb0;
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.15;
      }
      .session-rhythm-mark {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 25px;
        height: 25px;
        border: 1px solid #d4af37;
        border-radius: 50%;
        background: linear-gradient(145deg, #d4af37, #8f641c);
        color: #fff8dc;
        font-family: 'Cinzel', serif;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .session-rhythm-copy {
        display: block;
        min-width: 0;
      }
      .session-rhythm-copy strong,
      .session-rhythm-copy span,
      .session-rhythm-copy em,
      .session-rhythm-copy small,
      .session-rhythm-copy b {
        display: block;
      }
      .session-rhythm-copy strong {
        color: #fff7d6;
        font-family: 'Cinzel', serif;
        font-size: 0.94rem;
        line-height: 1.05;
      }
      .session-rhythm-duration {
        margin-top: 3px;
        color: #e1bd62;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .session-rhythm-copy em {
        margin-top: 6px;
        color: #fff3cf;
        font-size: 0.9rem;
        font-style: normal;
        font-weight: 700;
        line-height: 1.12;
      }
      .session-rhythm-copy small {
        margin-top: 4px;
        color: #f1dfb0;
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.12;
      }
      .session-rhythm-copy b {
        margin-top: 7px;
        padding-top: 5px;
        border-top: 1px solid rgba(212, 175, 55, 0.28);
        color: #d9bb70;
        font-size: 0.73rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .scriptorium-intention-entry {
        box-sizing: border-box;
        width: min(100%, 680px);
        margin: 10px auto 5px;
        padding: 13px 14px 14px;
        border: 2px solid rgba(212, 175, 55, 0.82);
        border-radius: 11px;
        background: linear-gradient(145deg, rgba(22, 12, 6, 0.9), rgba(65, 38, 16, 0.86));
        box-shadow: inset 0 0 0 1px rgba(255, 239, 178, 0.14), 0 5px 14px rgba(0, 0, 0, 0.28);
        color: #fff3cf;
        text-align: left;
      }
      .scriptorium-intention-heading { text-align: center; }
      .scriptorium-intention-heading p {
        margin: 0 0 3px;
        color: #e1bd62;
        font-family: 'Cinzel', serif;
        font-size: 0.67rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .scriptorium-intention-heading h2 {
        margin: 0;
        color: #fff7d6;
        font-family: 'Cinzel', serif;
        font-size: clamp(1.08rem, 2.5vw, 1.48rem);
        line-height: 1.08;
      }
      .scriptorium-intention-heading span {
        display: block;
        max-width: 590px;
        margin: 5px auto 0;
        color: #f1dfb0;
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.18;
      }
      .scriptorium-intention-choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 11px;
      }
      .scriptorium-intention-choice {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        box-sizing: border-box;
        min-width: 0;
        min-height: 144px;
        padding: 10px 9px;
        border: 1px solid rgba(212, 175, 55, 0.62);
        border-radius: 8px;
        background: rgba(45, 25, 11, 0.82);
        color: #fff3cf;
        cursor: pointer;
        font-family: 'Cormorant Garamond', serif;
        text-align: left;
        transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      }
      .scriptorium-intention-choice:hover,
      .scriptorium-intention-choice:focus-visible {

      .situated-application-status span { margin-top: 3px; color: #fff6cf; font-size: 0.88rem; font-style: normal; font-weight: 700; }
      .situated-application-status small { margin-top: 3px; }
      @keyframes responseArrives {

        100% { opacity: 1; transform: translateY(0); }

      @keyframes inkNoteAppears {

        100% { opacity: 1; letter-spacing: 0.1em; }

      /* Faixa serena de progresso dos desafios */
      .challenge-progress {
        box-sizing: border-box;
        width: 100%;
        margin: 0 auto 14px;
        padding: 10px 12px 9px;
        background: linear-gradient(135deg, rgba(255, 247, 218, 0.82), rgba(222, 188, 93, 0.2));
        border: 1px solid rgba(167, 122, 39, 0.58);
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 220, 0.42), 0 2px 7px rgba(68, 38, 12, 0.1);
        color: #4a2e16;
        text-align: left;
      }
      .challenge-progress-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .challenge-progress-heading > div,
      .challenge-progress-stats span,
      .challenge-step-copy {
        min-width: 0;
      }
      .challenge-progress-kicker {
        display: block;
        margin-bottom: 2px;
        color: #805615;
        font-family: 'Cinzel', serif;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .challenge-progress-heading > div > strong {
        display: block;
        color: #2b180a;
        font-family: 'Cinzel', serif;
        font-size: clamp(0.82rem, 1.8vw, 1.02rem);
        line-height: 1.1;
      }
      .challenge-progress-current {
        flex: 0 0 auto;
        padding: 4px 7px;
        border: 1px solid rgba(128, 86, 21, 0.36);
        border-radius: 20px;
        background: rgba(255, 247, 218, 0.58);
        color: #6f4a17;
        font-family: 'Cinzel', serif;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
        white-space: nowrap;
      }
      .challenge-progress-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }
      .challenge-progress-stats span {
        display: flex;
        align-items: baseline;
        gap: 5px;
        padding: 5px 7px;
        background: rgba(255, 247, 218, 0.52);
        border-left: 3px solid rgba(155, 116, 39, 0.7);
        border-radius: 4px;
      }
      .challenge-progress-stats strong {
        color: #6f4a17;
        font-family: 'Cinzel', serif;
        font-size: 1rem;
        line-height: 1;
      }
      .challenge-progress-stats small {
        color: #63451f;
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .challenge-sequence {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
        margin: 9px 0 0;
        padding: 0;
        list-style: none;
      }
      .challenge-step {
        position: relative;
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        padding: 3px 2px 2px;
      }
      .challenge-step:not(:last-child)::after {
        content: '';
        position: absolute;
        top: 14px;
        left: calc(100% - 1px);
        width: 6px;
        height: 2px;
        background: rgba(103, 63, 22, 0.28);
      }
      .challenge-step.completed:not(:last-child)::after,
      .challenge-step.current:not(:last-child)::after {
        background: #b48a32;
      }
      .challenge-step-marker {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: 1px solid rgba(103, 63, 22, 0.5);
        border-radius: 50%;
        background: rgba(103, 63, 22, 0.12);
        color: #795326;
        font-family: 'Cinzel', serif;
        font-size: 0.68rem;
        font-weight: 700;
      }
      .challenge-step-copy {
        display: block;
      }
      .challenge-step-copy strong,
      .challenge-step-copy small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .challenge-step-copy strong {
        color: #76501f;
        font-family: 'Cinzel', serif;
        font-size: 0.62rem;
        letter-spacing: 0.04em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      .challenge-step-copy small {
        margin-top: 2px;
        color: #8a6726;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.05;
      }
      .challenge-step.completed .challenge-step-marker {
        border-color: #7a541e;
        background: #7a541e;
        color: #fff3cf;
      }
      .challenge-step.completed .challenge-step-copy strong { color: #6f4a17; }
      .challenge-step.current .challenge-step-marker {
        border: 2px solid #a77a27;
        background: #d4af37;
        color: #fff8dc;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
      }
      .challenge-step.current .challenge-step-copy strong { color: #8a5c12; }
      .challenge-step.future .challenge-step-marker {
        border-color: rgba(103, 63, 22, 0.28);
        background: rgba(103, 63, 22, 0.06);
        color: rgba(103, 63, 22, 0.55);
      }
      .challenge-step.future .challenge-step-copy strong,
      .challenge-step.future .challenge-step-copy small { color: rgba(103, 63, 22, 0.48); }
      .challenge-sequence-legend {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 5px;
        color: #795326;
        font-size: 0.68rem;
        font-weight: 700;
      }
      .challenge-sequence-legend span::before {
        content: '•';
        margin-right: 3px;
        color: #8f806b;
      }
      .challenge-sequence-legend .completed::before { color: #7a541e; }
      .challenge-sequence-legend .current::before { color: #d4af37; }

      /* Ordering Game */

      .teaching-order-list {

      /* Verses */
      .verse-input {

      .verse-input::placeholder {

      .verse-input:focus {

      }
      .challenge-screen {
        width: 100%;

        padding-bottom: 14px;

      .challenge-title {

      .mute-btn {

      }
      .mute-icon {
        font-size: 0.95rem;

      /* Mapa contemplativo da jornada */
      .journey-map {
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #24150c;
      }
      .journey-kicker {
        margin: 0 0 4px;
        color: #76501f;
        font-family: 'Cinzel', serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .journey-map h1 {
        margin: 0 0 6px;
        color: #1b1009;
        font-size: clamp(1.35rem, 3vw, 2.2rem);
        line-height: 1.05;
      }
      .journey-intro {
        max-width: 560px;
        margin: 0 0 12px;
        padding: 8px 14px;
        color: #3f2817;
        background: rgba(255, 247, 218, 0.72);

        border-radius: 7px;
        font-size: 1.05rem;
        line-height: 1.2;

      .map-route {
        position: relative;
        width: min(100%, 620px);
        display: grid;
        grid-template-columns: repeat(5, minmax(84px, 1fr));
        gap: 8px;
        align-items: start;
        padding: 10px 0 4px;
      }
      .map-route::before {
        content: '';
        position: absolute;
        top: 35px;
        left: 9%;
        right: 9%;
        height: 3px;
        background: linear-gradient(90deg, #b48a32 0%, #b48a32 25%, rgba(91, 61, 25, 0.28) 25%, rgba(91, 61, 25, 0.28) 100%);

      .map-node {

        height: 48px;
        margin: 0 auto 7px;

        background: #d4af37;

      .map-node-title {
        display: block;

        text-transform: uppercase;

      .map-node.future .map-node-title,

        font-size: 0.82rem;

<script>
    (() => {
        const splashRoot = document.getElementById('rosebud-exported-splash');
        if (!splashRoot) return;

        let isReady = false;
        let isMinimumVisibleTimeElapsed = false;
        let isHidden = false;

        const maybeHideSplash = () => {
            if (isHidden || !isReady || !isMinimumVisibleTimeElapsed) return;

            isHidden = true;
            splashRoot.classList.add('is-hiding');
            window.setTimeout(() => splashRoot.remove(), 500);
        };

        const markReady = () => {
            isReady = true;
            maybeHideSplash();
        };

        window.setTimeout(() => {
            isMinimumVisibleTimeElapsed = true;
            maybeHideSplash();
        }, 1000);

        if (document.readyState === 'complete') {
            markReady();
        } else {
            window.addEventListener('load', markReady, { once: true });
        }

        
    })();
</script></body>
